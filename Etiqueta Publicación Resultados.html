<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Resultados 2026</title>
    <style>
        /* Estilos base y centrado total */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Contenedor principal (Tarjeta) */
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* Estilo del enlace tipo botón */
        .enlace-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 25px;
        }

        .enlace-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Texto informativo */
        .mensaje-aviso {
            color: #4a5568;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
        }

        .fecha-resaltada {
            display: block;
            color: #2d3748;
            font-weight: 800;
            font-size: 1.2rem;
            margin: 10px 0;
        }

        /* Decoración sutil */
        .icono {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="icono">📅</span>
        
        <a href="#" class="enlace-btn">Ir al Portal de Consulta</a>

        <p class="mensaje-aviso">
            Los Resultados estarán disponibles después del 
            <span class="fecha-resaltada">6 de Julio de 2026</span>
            para consulta, toma de decisiones y generación de estrategia con un plan de mejora educativo.
        </p>
    </div>

</body>
</html>
